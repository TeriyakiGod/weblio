
{% load wagtailimages_tags %}
<div class="landing-page">
    
    <div class="hero-conainer">

        {% if page.hero_image %}
            {% image page.hero_image original %}
        {% endif %}

        <div class="bg-yellow-300 text-center absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2">
            <div class="bg-black relative bottom-5 right-5 p-5">
                <h1 class="tomorrow-black text-5xl text-white">{{ page.title }}</h1>
            </div>
        </div>

    </div>
    
    {% if page.hero_text %}
        <p class="hero-text">{{ page.hero_text }}</p>
    {% endif %}
</div>
